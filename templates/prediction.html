<!DOCTYPE html>
<html>
<head>
    <title>Financial Health Prediction</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f7fb;
        }

        .container {
            width: 750px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #243447;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #243447;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1abc9c;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            background: #eef7ee;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Financial Health Prediction</h1>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">
            <label>Age</label>
            <input
                type="number"
                name="age"
                min="18"
                required
            >
        </div>

        <div class="form-group">
            <label>Gender</label>

            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
        </div>

        <div class="form-group">
            <label>Education</label>

    <select name="education_level" required>
        <option value="">Select Education</option>
        <option value="High School">High School</option>
        <option value="Bachelor">Bachelor</option>
        <option value="Master">Master</option>
        <option value="PhD">PhD</option>
    </select>
        </div>

        <div class="form-group">
            <label>Employment Status</label>

            <select name="employment_status" required>
                <option value="">Select Employment</option>
                <option value="Employed">Employed</option>
                <option value="Self-employed">Self-employed</option>
                <option value="Unemployed">Unemployed</option>
                <option value="Student">Student</option>
            </select>
        </div>

        <div class="form-group">
            <label>Monthly Income (USD)</label>

            <input
                type="number"
                name="monthly_income_usd"
                min="0"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label>Monthly Expenses (USD)</label>

            <input
                type="number"
                name="monthly_expenses_usd"
                min="0"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label>Savings (USD)</label>

            <input
                type="number"
                name="savings_usd"
                min="0"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label>Has Loan?</label>

            <select name="has_loan" required>
                <option value="">Select</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
            </select>
        </div>

        <div class="form-group">
            <label>Loan Amount (USD)</label>

            <input
                type="number"
                name="loan_amount_usd"
                min="0"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label>Monthly EMI (USD)</label>

            <input
                type="number"
                name="monthly_emi_usd"
                min="0"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label>Debt-to-Income Ratio</label>

            <input
                type="number"
                name="debt_to_income_ratio"
                min="0"
                step="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label>Credit Score</label>

            <input
                type="number"
                name="credit_score"
                min="300"
                max="900"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label>Savings-to-Income Ratio</label>

            <input
                type="number"
                name="savings_to_income_ratio"
                min="0"
                step="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label>Expense Ratio</label>

            <input
                type="number"
                name="expense_ratio"
                min="0"
                step="0.01"
                required
            >
        </div>

        <button type="submit">
            Predict Financial Health
        </button>

    </form>

    {% if result %}
        <div class="result">
            {{ result }}
        </div>
    {% endif %}

</div>

</body>
</html>
