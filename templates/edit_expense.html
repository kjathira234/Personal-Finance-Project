<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1e293b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
            margin-bottom: 5px;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.10);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            text-decoration: none;
            font-size: 15px;
        }

        .cancel:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Edit Expense</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Category:</label>
            <input
                type="text"
                name="category"
                value="{{ expense.category }}"
                required
            >

            <br><br>

            <label>Amount:</label>
            <input
                type="number"
                name="amount"
                value="{{ expense.amount }}"
                required
            >

            <br><br>

            <label>Date:</label>
            <input
                type="date"
                name="date"
                value="{{ expense.date|date:'Y-m-d' }}"
                required
            >

            <br><br>

            <button type="submit">
                Update Expense
            </button>

        </form>

        <br>

        <a href="{% url 'financial_details' %}" class="cancel">
            Cancel
        </a>

    </div>

</body>
</html>
